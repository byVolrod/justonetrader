    <!-- J (traits épaissis 18px au lieu de 12-13) -->
    <rect x="0"  y="0" width="40" height="18"/>
    <rect x="12" y="0" width="16" height="48"/>
    <path d="M0 40 L0 52 Q0 66 14 66 L30 66 L30 52 L20 52 Q16 52 16 48 L16 40 Z"/>

    <!-- O (murs épaissis ~17px) -->
    <path d="M50 17 Q50 0 67 0 L105 0 Q122 0 122 17 L122 39 Q122 56 105 56 L67 56 Q50 56 50 39 Z"/>
    <rect x="67" y="17" width="38" height="22" fill="#181818"/>
    <rect x="50" y="60" width="72" height="11" rx="2"/>

    <!-- T (traits épaissis) -->
    <rect x="136" y="0"  width="55" height="18"/>
    <rect x="152" y="0"  width="18" height="66"/>

  </g>
</svg>
